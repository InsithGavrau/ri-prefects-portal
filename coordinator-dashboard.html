<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Coordinator dashboard for school duty attendance.">
  <link rel="stylesheet" href="css/styles.css">
  <title>Coordinator Dashboard | RI Prefect Portal</title>
</head>
<body data-page="coordinator-dashboard" data-role="coordinator">

    <main class="route-fallback" aria-busy="true">

  <script type="module" src="js/app.js"></script>
