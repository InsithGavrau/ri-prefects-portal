<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the Royal Institute Prefects Portal.">
  <link rel="stylesheet" href="css/styles.css">
  <title>Login | RI Prefect Portal</title>
</head>
<body data-page="login">
  <main class="auth-wrap">
    <section class="card auth-card">
      <img class="auth-logo" src="assets/rilogo.png" alt="Royal Institute logo">
      <p class="eyebrow">Secure access</p>
      <h1>Royal Institute Prefects Portal</h1>
      <p class="lede">The light of Learning</p>
      <div data-setup></div>
      <form id="login-form">
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
        <button class="btn" type="submit">Sign in</button>
      </form>
    </section>
    <p class="auth-links">New prefect? <a href="signup.html">Create an account</a></p>
    <footer class="portal-footer auth-footer">System developed by Insith Liyana Arachchi | 2026 Headboard <span>|</span> <a href="mailto:insith6969@gmail.com">Technical Issues</a> <span>|</span> <a href="PASTE_INSITH_LINKEDIN_URL_HERE">LinkedIn</a></footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
