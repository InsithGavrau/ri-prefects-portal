<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View your prefect duty attendance history.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal-polish.css">
  <title>Attendance History | RI Prefect Portal</title>
</head>
<body data-page="prefect-attendance-history" data-role="prefect,coordinator">
  <div id="app">
    <main class="route-fallback" aria-busy="true">
      <section class="card fallback-card">
        <p class="eyebrow">Prefect portal</p><h1>Attendance History</h1>
        <p>Loading your dated duty records, locations, final attendance statuses, and notes.</p>
        <div class="fallback-features"><span>Date</span><span>Duty and location</span><span>Attendance status</span><span>Notes</span></div>
        <div class="fallback-status"><i></i>Loading your attendance records...</div>
      </section>
    </main>
  </div>
  <noscript><p class="noscript-note">JavaScript is required to view protected attendance data.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
