<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review attendance sessions submitted through the Royal Institute Prefects Attendance Portal.">
  <link rel="stylesheet" href="css/styles.css">
  <title>My Sessions | RI Prefect Portal</title>
</head>
<body data-page="coordinator-sessions" data-role="coordinator">

    <main class="route-fallback" aria-busy="true"><section class="card fallback-card">

      <div class="fallback-status"><i></i>Loading your submitted sessions...</div>
    </section></main>

  <script type="module" src="js/app.js"></script>

</html>
