<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View and update your Royal Institute Prefects Attendance Portal profile.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal-polish.css">
  <title>My Profile | RI Prefect Portal</title>
</head>
<body data-page="prefect-profile" data-role="prefect,coordinator">
  <div id="app">
    <main class="route-fallback" aria-busy="true"><section class="card fallback-card">
      <p class="eyebrow">Prefect profile</p><h1>My Profile</h1>

      <div class="fallback-features"><span>Contact details</span><span>School class</span><span>Account status</span><span>Motivation</span></div>
      <div class="fallback-status"><i></i>Loading your protected profile...</div>
    </section></main>

  <script type="module" src="js/app.js"></script>

</html>
